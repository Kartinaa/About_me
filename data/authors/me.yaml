bio: |
  I'm a Ph.D. student in the Borch Department of Medicinal Chemistry and Molecular Pharmacology
  at Purdue University, advised by [Dr. Jianing Li](https://web.ics.purdue.edu/~li4578/).
  Before that, I received my M.S. in Pharmaceutical Sciences from the University of Pittsburgh
  in 2023 under the supervision of Dr. Jaden Jun, and my BS in Pharmaceutical Engineering from East China University of
  Science and Technology.

  My Ph.D. research focuses on developing and applying structure-based generative models for
  small-molecule drug discovery, with an emphasis on integrating chemical prior knowledge into
  these models. I'm also interested in synthesis-aware molecular generation, molecular property
  prediction, and agentic workflows for drug discovery. Beyond that, I contribute to
  chemoinformatics, molecular modeling, and medicinal chemistry projects. With interdisciplinary
  training, I aim to bring insights from these fields together to accelerate drug discovery.

  I'm always open to new collaborations, feel free to [email me](mailto:yang2531@purdue.edu)
  if you're interested!


